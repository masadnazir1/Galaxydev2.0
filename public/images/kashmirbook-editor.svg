<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#F8FAFC"/>
  <!-- Browser chrome -->
  <rect x="40" y="20" width="720" height="30" rx="6" fill="#E2E8F0"/>
  <circle cx="55" cy="35" r="5" fill="#EF4444"/>
  <circle cx="70" cy="35" r="5" fill="#F59E0B"/>
  <circle cx="85" cy="35" r="5" fill="#10B981"/>
  <rect x="100" y="28" width="200" height="14" rx="4" fill="#CBD5E1"/>
  <!-- Content -->
  <rect x="40" y="60" width="720" height="420" rx="0 0 6 6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- Editor toolbar -->
  <rect x="60" y="80" width="680" height="40" rx="6" fill="#F1F5F9"/>
  <rect x="75" y="92" width="60" height="16" rx="3" fill="#1B6B3A" fill-opacity="0.15"/>
  <rect x="150" y="92" width="60" height="16" rx="3" fill="#1B6B3A" fill-opacity="0.1"/>
  <rect x="225" y="92" width="60" height="16" rx="3" fill="#1B6B3A" fill-opacity="0.1"/>
  <rect x="650" y="90" width="70" height="20" rx="4" fill="#1B6B3A"/>
  <!-- Title field -->
  <rect x="60" y="140" width="680" height="14" rx="3" fill="#1B6B3A" fill-opacity="0.15"/>
  <rect x="60" y="165" width="500" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="60" y="185" width="550" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="60" y="205" width="480" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="60" y="225" width="520" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="60" y="245" width="350" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="60" y="275" width="680" height="1" fill="#E2E8F0"/>
  <!-- Feature pills -->
  <rect x="60" y="295" width="100" height="28" rx="14" fill="#1B6B3A" fill-opacity="0.08"/>
  <text x="80" y="313" font-family="sans-serif" font-size="10" fill="#1B6B3A" font-weight="600">Bold</text>
  <rect x="170" y="295" width="80" height="28" rx="14" fill="#1B6B3A" fill-opacity="0.08"/>
  <text x="186" y="313" font-family="sans-serif" font-size="10" fill="#1B6B3A" font-weight="600">Italic</text>
  <rect x="260" y="295" width="120" height="28" rx="14" fill="#1B6B3A" fill-opacity="0.08"/>
  <text x="280" y="313" font-family="sans-serif" font-size="10" fill="#1B6B3A" font-weight="600">Heading</text>
  <rect x="390" y="295" width="100" height="28" rx="14" fill="#1B6B3A" fill-opacity="0.08"/>
  <text x="408" y="313" font-family="sans-serif" font-size="10" fill="#1B6B3A" font-weight="600">Link</text>
  <rect x="500" y="295" width="100" height="28" rx="14" fill="#1B6B3A" fill-opacity="0.08"/>
  <text x="518" y="313" font-family="sans-serif" font-size="10" fill="#1B6B3A" font-weight="600">Image</text>
  <!-- Preview pane -->
  <rect x="60" y="340" width="680" height="120" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="80" y="360" width="300" height="12" rx="3" fill="#1B6B3A" fill-opacity="0.15"/>
  <rect x="80" y="382" width="600" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="398" width="580" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="414" width="620" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="430" width="450" height="8" rx="3" fill="#CBD5E1"/>
  <!-- Placeholder text -->
  <text x="220" y="460" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Placeholder: KashmirBook Editor Interface</text>
  <rect x="180" y="445" width="440" height="1" fill="#E2E8F0"/>
</svg>
